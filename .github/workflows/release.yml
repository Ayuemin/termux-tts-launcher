name: Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'Ayuemin/termux-tts-launcher'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK 35
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Run player regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is not configured. Cannot build a signed release."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          ls -l "$RUNNER_TEMP/release.jks"
      - name: Build release-signed APK
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify APK version and signature, prepare release files
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/aapt" dump badging "$APK" | grep -F "versionName='1.2.0'"
          "$BT/aapt" dump badging "$APK" | grep -F "versionCode='4'"
          if "$BT/apksigner" verify --print-certs "$APK" | grep -F 'CN=Android Debug'; then
            echo "::error::APK is signed with the Android debug key. Refusing to publish."
            exit 1
          fi
          "$BT/apksigner" verify --print-certs "$APK"
          mkdir -p dist
          cp "$APK" dist/ozvuchit-v1.2.0.apk
          (cd dist && sha256sum ozvuchit-v1.2.0.apk > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt
      - name: Create GitHub release and upload APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=v1.2.0
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::GitHub Release $TAG already exists. Refusing to overwrite a finalized release."
            exit 1
          fi
          gh release create "$TAG" \
            dist/ozvuchit-v1.2.0.apk \
            dist/SHA256SUMS.txt \
            --verify-tag \
            --title 'Озвучить v1.2.0 — постоянная подпись' \
            --notes-file RELEASE_NOTES.md \
            --latest
