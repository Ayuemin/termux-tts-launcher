name: Build Android APK
on:
  push:
    branches: [main, feature/streaming-tts]
    paths:
      - 'android/**'
      - 'termux/**'
      - 'tests/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK 35
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test Python player and loopback streaming server
        run: python3 -m unittest discover -s tests -v
      - name: Build stable and experimental debug APKs
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug :streamapp:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: termux-tts-stream-experimental-apk
          path: android/streamapp/build/outputs/apk/debug/streamapp-debug.apk
          if-no-files-found: error
          retention-days: 30
